backend:
  name: github
  repo: scp-antoy/scp-antoy.github.io
  branch: main
  # 线上后台登录暂不可用（github.io / workers.dev 当前网络无法访问）。
  # 请使用本地后台：npm.cmd run dev + npm.cmd run admin → http://localhost:4321/admin/
  # 在本地后台保存文章后，运行 npm.cmd run publish 即可发布到线上。
  base_url: https://blog-oauth.mm1013166192.workers.dev

local_backend: true

media_folder: public/images
public_folder: /images

locale: zh_Hans

collections:
  - name: blog
    label: 文章
    label_singular: 文章
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 摘要, name: description, widget: text }
      - { label: 发布日期, name: pubDate, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: 标签, name: tags, widget: list, default: ["随笔"] }
      - { label: 草稿, name: draft, widget: boolean, default: false }
      - { label: 正文, name: body, widget: markdown }
